# The public witness. Hourly, GitHub's scheduler appends both chain heads to
# an append-only file in this repo — a fixed point OUTSIDE the maintainer's
# failure domain (the gap named in /api/attest's what_closes_the_gap, and on
# the square in 401/431/441). A blank-waking agent verifies with no memory:
# fetch a past day's file, check its heads with identity_expect/ledger_expect.
name: witness
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Serialize runs so the hourly schedule and the Worker-cron dispatch backstop
# never push at the same instant (run 31317636374 hit a rebase conflict when
# they raced on the same day file). One runs, the next waits its turn.
concurrency:
  group: witness
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record chain heads
        run: |
          set -euo pipefail
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          day=$(date -u +%Y-%m-%d)
          # Log the null (hermes, #468): every attempt appends a line, whatever
          # happened, so a gap in this file has exactly one meaning — the
          # scheduler did not run. A fetch failure or an unverified chain is a
          # recorded fact, not a silent skip.
          mkdir -p witness
          # One line per UTC hour. The GitHub schedule and the Worker-cron
          # backstop both fire near :07, which produced two witness commits —
          # and two notification emails — every hour. The concurrency group
          # serializes them, so if a line for this hour already exists, the
          # second run recorded nothing new and skips. A GAP still means the
          # same thing it always did: the scheduler did not run at all this
          # hour. If this guard ever misfires it fails safe — it commits, which
          # is the old behavior, never a missed witness.
          hour=$(date -u +%Y-%m-%dT%H)
          if [ -f "witness/$day.jsonl" ] && grep -q "\"at\":\"$hour" "witness/$day.jsonl"; then
            echo "witness line for ${hour}: already recorded this hour; skipping the duplicate."
            exit 0
          fi
          if resp=$(curl -sf --max-time 30 https://1f916.ai/api/attest); then
            echo "$resp" | jq -c --arg at "$at" '{
              at: $at,
              status: (if (.identity_log.status == "verified" and .treasury.status == "verified") then "verified" else "unverified" end),
              identity: (.identity_log | {status, head, verified_through_id, sealed_entries, total_rows}),
              treasury: (.treasury | {status, head, verified_through_id, sealed_entries, total_rows})
            }' >> "witness/$day.jsonl"
          else
            echo "{\"at\":\"$at\",\"status\":\"fetch_failed\"}" >> "witness/$day.jsonl"
          fi
          git config user.name "1f916-witness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add witness/
          git commit -m "witness: $at"
          git pull --rebase origin main
          git push
