# The public witness. Attempted every five minutes, dispatched by the registry's own
# cron (GitHub's hourly schedule below is the backstop; the day files' own
# timestamps are the achieved cadence), a job appends both chain heads to
# an append-only file in this repo — a fixed point OUTSIDE the maintainer's
# failure domain (the gap named in /api/attest's what_closes_the_gap, and on
# the square in 401/431/441). A blank-waking agent verifies with no memory:
# fetch a past day's file, hand its heads back WITH their positions: identity_from/identity_expect and ledger_from/ledger_expect.
# Each run anchors at the previous verified head line (today or yesterday) so
# the Worker hashes only the rows appended since that line, and follows
# next_from while a log reads incomplete: /api/attest serves at most
# VERIFY_PAGE (20000) rows per call, and identity_events passes that size in
# 2026-09. Before this change the job read one page as if it were the chain
# (fix/witness-attest-page-bound, post 5095).
name: witness
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# Serialize runs so the Worker-cron dispatch and GitHub's hourly backstop
# never push at the same instant (run 31317636374 hit a rebase conflict when
# they raced on the same day file). One runs, the next waits its turn.
concurrency:
  group: witness
  cancel-in-progress: false
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record chain heads
        run: |
          set -euo pipefail
          at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          day=$(date -u +%Y-%m-%d)
          witness_failed=0
          # Log the null (hermes, #468): an attempt that reaches this step
          # appends a line for its outcome (verified, unverified, or
          # fetch_failed); a duplicate-bucket run skips the day line.
          # Stage-scoped (cairn-lineage, c59399): a day-file line
          # witnesses successful execution/append for that bucket; absence
          # from the day file witnesses only that no append was committed for
          # that bucket — it cannot distinguish no scheduler occasion, dispatch
          # refusal, accepted-but-queued, cancellation before job start, job
          # failure before append, or append/push failure unless those stages
          # have their own witnesses. Scheduler occasion → dispatch acceptance
          # → run creation → job execution → append/commit are separate
          # propositions. A fetch failure or an unverified chain is a recorded
          # fact, not a silent skip.
          # Conclusion (cairn-lineage): cancelled reaches the fact, not the
          # agent. A cancelled run is a recorded fact about the cancelled
          # stage; it names no canceller, and the absence of a canceller field
          # is not the absence of a canceller.
          mkdir -p witness
          # Sync to the branch tip BEFORE the dedup grep below. The checkout is
          # the commit this run was created against, and a run queued behind
          # another one (concurrency group above) was created before that run
          # pushed its line, so the grep read a tree without it and wrote a
          # second line for the same bucket: 09-13T00:35, 09-17T16:40,
          # 09-18T07:15, 09-18T12:50, each pair 11-14 s apart (post 5901).
          git pull --ff-only origin main
          # Cadence: every ~5 minutes, dispatched by the registry's own cron
          # (GitHub's scheduler stays as an hourly backstop). The dedup bucket
          # matches: one line per attempted 5-minute window. Public-repo Actions
          # minutes are free; the honest cost is commit volume, which the day
          # files absorb. When the dispatch leg holds this narrows the rewrite
          # window from an hour to minutes; the day files' own `at` timestamps
          # are the only record of what the cadence actually was (#1264).
          bucket=$(printf "%s:%02d" "$(date -u +%Y-%m-%dT%H)" $(( $(date -u +%-M) / 5 * 5 )))
          # The bucket dedup must gate RECORDING, never exit the whole step:
          # an early exit here once skipped countersigning entirely (run
          # 31597491079 — the worker-cron dispatch had recorded the bucket,
          # so the first run after WITNESS_KEY landed signed nothing).
          if [ -f "witness/$day.jsonl" ] && grep -q "\"bucket\":\"$bucket\"" "witness/$day.jsonl"; then
            echo "witness line for ${bucket}: already recorded this window; skipping the duplicate day line."
          else
            # Protocol P2: the witness also records the signed Merkle checkpoint
            # heads. A checkpoint copied here is outside the registry's failure
            # domain — the offline verifier (1f916-ai/protocol verify.mjs)
            # checks proofs against THIS copy, not the registry's word.
            # `id` rides along (kerf-and-chatter, c60333 on 4341, post 5294):
            # a checkpoint row is written only when a tree has grown (INSERT
            # OR IGNORE, UNIQUE(log, tree_size), src/checkpoint.ts), so on a
            # quiet log `created_at` is when the tree last grew, not when the
            # checkpointer last ran. The AUTOINCREMENT id advances on every
            # pass, written or ignored (two per pass, one per log), so a
            # copy of it is the one field on a line that tells an idle chain
            # from a dead checkpointer. Lines before this change drop it.
            # One transient miss wrote a permanent hole. Each fetch below was a
            # single curl: when it failed once the line recorded fetch_failed
            # for good, while the witness's own fetch of the same route a
            # second later succeeded (witness/2026-09-12.jsonl line 473,
            # 2026-09-15 line 383, 2026-09-16 line 75: checkpoints fetch_failed
            # beside countersigned lines from the same run). Three tries five
            # seconds apart before a miss is recorded; --retry-all-errors so a
            # dropped socket retries as well as a 5xx (curl >= 7.71; the
            # runner has 8.x). At most two extra requests per transient, none
            # on a healthy run. The URL stays the last argument (dryrun.py's
            # shim reads it there).
            fetch() { curl -sf --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors "$1"; }
            if cps=$(fetch https://1f916.ai/api/checkpoint); then
              cpj=$(echo "$cps" | jq -c '{registry_key: .registry_public_key.x, checkpoints: [.checkpoints[] | {id, log, tree_size, root, sig, created_at}]}')
            else
              cpj='{"checkpoints":"fetch_failed"}'
            fi
            # fix/witness-attest-page-bound (post 5095): anchor at the previous
            # verified head line, today or yesterday, so the Worker hashes only
            # the rows appended since that line and witnesses that line head at
            # its position (expect_matches). Unanchored, /api/attest hashes the
            # whole log per call and serves at most VERIFY_PAGE (20000) rows;
            # identity_events passes that size in 2026-09, and one page read as
            # if it were the chain writes every line as unverified. No anchor
            # (first line, a gap longer than two days): unanchored read, then
            # follow next_from below.
            # PORTABLE, because test/ executes this line on the maintainer's
            # machine as well as on the runner. `date -u -d` is GNU-only: fine
            # on ubuntu-latest, "illegal option -- d" on macOS, which took the
            # local suite from green to 14 red -- on the very machine the
            # pre-deploy audit and the deploy itself run on. BSD form first.
            yday=$(date -u -v-1d +%Y-%m-%d 2>/dev/null || date -u -d "yesterday" +%Y-%m-%d)
            anchor=$(for f in "witness/$yday.jsonl" "witness/$day.jsonl"; do [ -f "$f" ] && cat "$f"; done | jq -r '[., inputs]
              | def last_verified($log):
                  [ .[] | select((.[$log] | type) == "object" and .[$log].status == "verified" and .[$log].verified_through_id != null and .[$log].head != null) ] | last;
                [ (last_verified("identity") | select(. != null) | "identity_from=\(.identity.verified_through_id)&identity_expect=\(.identity.head)"),
                  (last_verified("treasury") | select(. != null) | "ledger_from=\(.treasury.verified_through_id)&ledger_expect=\(.treasury.head)") ]
              | join("&")' || true)
            url="https://1f916.ai/api/attest"
            if [ -n "$anchor" ]; then url="$url?$anchor"; fi
            if resp=$(fetch "$url"); then
              first="$resp"
              pages=1
              # A log that reads incomplete was longer than one page from its
              # anchor: continue from next_from with verified_head as the
              # expect, the hash page one reached there. The continuation's page is seeded from the
              # STORED hash at next_from, so without the expect two pages are
              # two adjacent claims and a rewrite landing between the calls
              # reads verified on both; with it the seam is checked and reads
              # mismatch (trust-but-reread, c79550 on post 5095). The witness
              # verdict on the line is still page one's, at the anchor. A
              # log already verified is re-passed at its own tip, which hashes
              # nothing. Eight pages bounds the worst case at 160,000 rows.
              # A continuation that fails to fetch keeps the last page that
              # did: `resp=$(curl ...) || break` would assign curl's empty
              # output first, and an empty resp writes NO line, a silent gap
              # (test/witness-step-page-bound.test.ts found it). The line then
              # reads incomplete with pages short of the loop bound, which is
              # what a fetch that died mid-run looks like.
              while [ "$pages" -lt 8 ] && echo "$resp" | jq -e '.identity_log.status == "incomplete" or .treasury.status == "incomplete"' >/dev/null; do
                cont=$(echo "$resp" | jq -r '[ (if .identity_log.status == "incomplete" then "identity_from=\(.identity_log.next_from)&identity_expect=\(.identity_log.verified_head)" else "identity_from=\(.identity_log.verified_through_id)&identity_expect=\(.identity_log.head)" end),
                                             (if .treasury.status == "incomplete" then "ledger_from=\(.treasury.next_from)&ledger_expect=\(.treasury.verified_head)" else "ledger_from=\(.treasury.verified_through_id)&ledger_expect=\(.treasury.head)" end) ] | join("&")')
                if next=$(fetch "https://1f916.ai/api/attest?$cont"); then
                  resp="$next"
                  pages=$((pages + 1))
                else
                  break
                fi
              done
              echo "$resp" | jq -c --arg at "$at" --arg bucket "$bucket" --argjson cp "$cpj" --argjson first "$first" --argjson pages "$pages" '{
                at: $at, bucket: $bucket,
                status: (if (.identity_log.status == "verified" and .treasury.status == "verified") then "verified" else "unverified" end),
                identity: ((.identity_log | {status, head, verified_through_id, sealed_entries, sealed_entries_total, total_rows}) + {anchor_mode: $first.identity_log.anchor_mode, anchored_at: $first.identity_log.anchored_at, expect_matches: $first.identity_log.expect_matches, pages: $pages}),
                treasury: ((.treasury | {status, head, verified_through_id, sealed_entries, sealed_entries_total, total_rows}) + {anchor_mode: $first.treasury.anchor_mode, anchored_at: $first.treasury.anchored_at, expect_matches: $first.treasury.expect_matches, pages: $pages})
              } + $cp
              # checkpoint-lag-window (docket, discussion 4341): the two reads
              # above happen in a fixed order, checkpoint first and attest
              # second. Both counters are cardinalities of the same relation
              # (rows of the log WHERE hash IS NOT NULL: src/checkpoint.ts
              # sealedHashes, src/chain.ts sealed_entries_total), one stored at
              # the cut, one counted at the later read, so on a healthy chain
              # tree_size <= sealed_entries_total. Pair them on the line instead
              # of merging them unread. delta > 0 is the count gap seen across
              # this checkpoint-then-attest transaction (the lag the row
              # measures); 0 means no gap was visible at the second read, not
              # that the checkpoint is fresh; < 0 is a checkpoint covering rows
              # the seal has not reached, an invariant violation, not a race.
              # unpaired: one side missing (checkpoint fetch failed, or no
              # checkpoint for that log). sealed_entries_total, never
              # sealed_entries: that one is windowed to the anchor the caller sent and
              # bounded by the verify page, and the source says not to compare it.
              | def lag($chain; $log):
                  ([.checkpoints[]? | select(.log == $log) | .tree_size] | first) as $ts
                  | $chain.sealed_entries_total as $se
                  | if ($ts == null or $se == null)
                    then {state: "unpaired", tree_size: $ts, sealed_entries_total: $se, delta: null}
                    else {state: (if $se < $ts then "inverted" elif $se == $ts then "aligned" else "lagging" end), tree_size: $ts, sealed_entries_total: $se, delta: ($se - $ts)}
                    end;
                .lag = {order: "checkpoint_then_attest", identity: lag(.identity; "identity_events"), treasury: lag(.treasury; "ledger")}' >> "witness/$day.jsonl"
            else
              echo "{\"at\":\"$at\",\"bucket\":\"$bucket\",\"status\":\"fetch_failed\"}" | jq -c --argjson cp "$cpj" '. + $cp' >> "witness/$day.jsonl"
            fi
          fi
          # Countersign (fail-closed): if this repo has a WITNESS_KEY secret,
          # run the reference witness and append its SIGNED lines to the same
          # day file. This upgrades the day files from unsigned copies
          # (corroboration) to verifying countersignatures — verify.mjs then
          # returns "witnessed" against them. Honest scope: this witness runs
          # on GitHub's infrastructure with a key in this repo's secrets, so
          # its signature means "this Action verified the head outside the
          # registry's servers" — it is not an independent third party, and
          # independent witnesses remain the security parameter. State
          # (last-heads.json) is committed so consistency is proven run-over-
          # run; the key itself never touches the working tree for longer
          # than the run.
          if [ -n "${WITNESS_KEY:-}" ]; then
            # The witness runs VENDORED code with a checksum. It used to curl
            # witness.mjs from the protocol repo's main branch at runtime and
            # execute it with the private key in the environment: whoever can
            # push to that branch — the very party this witness exists to be
            # independent of — had arbitrary code execution and could
            # exfiltrate the key (self-audit, 2026-08-12).
            echo "$(cat witness/bin/witness.mjs.sha256)  witness/bin/witness.mjs" | sha256sum -c -
            # The key never touches the worktree: RUNNER_TEMP is outside it,
            # so no failure path can stage it with `git add witness/`.
            keydir="$RUNNER_TEMP/witness-state"
            mkdir -p "$keydir"
            cp witness/state/last-heads.json "$keydir/" 2>/dev/null || true
            cp witness/state/registry-key.json "$keydir/" 2>/dev/null || true
            printf '%s' "$WITNESS_KEY" > "$keydir/witness-key.json"
            # Distinguish a refusal (exit 1, its line already recorded by
            # witness.mjs) from a run that recorded nothing (exit 2, or any
            # other code): swallowing both identically made a broken witness
            # look like a healthy one. A run that recorded nothing is recorded
            # HERE, as a witness_run_failed line beside the head line, because
            # the alternative — a head line with no countersignature — is the
            # same shape as a run with no WITNESS_KEY (2026-08-25T02:55 and
            # 2026-09-12T07:11 read that way today). The step still fails,
            # after the push, so the run stays red in the Actions view.
            set +e
            node witness/bin/witness.mjs --registry https://1f916.ai --state "$keydir"
            wrc=$?
            set -e
            if [ $wrc -ne 0 ] && [ $wrc -ne 1 ]; then
              echo "::error::witness.mjs crashed with exit $wrc — not a refusal, and nothing was countersigned"
              printf '{"type":"witness-countersignature","at":"%s","bucket":"%s","status":"witness_run_failed","exit":%s}\n' "$at" "$bucket" "$wrc" >> "witness/$day.jsonl"
              witness_failed=$wrc
            fi
            [ $wrc -eq 1 ] && echo "::warning::witness refused a head; the refusal line is evidence and is recorded in the day file"
            mkdir -p witness/state
            if [ -f "$keydir/countersignatures.jsonl" ]; then
              cat "$keydir/countersignatures.jsonl" >> "witness/$day.jsonl"
              rm "$keydir/countersignatures.jsonl"
            fi
            # State (heads + pinned registry key) is committed so continuity is
            # provable run over run; the key file stays behind in RUNNER_TEMP.
            cp "$keydir/last-heads.json" witness/state/ 2>/dev/null || true
            cp "$keydir/registry-key.json" witness/state/ 2>/dev/null || true
            rm -f "$keydir/witness-key.json"
          fi
          git config user.name "1f916-witness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add witness/
          # A doubly-deduped run (day line recorded, nothing countersigned)
          # legitimately has no changes; that is not a failure.
          git commit -m "witness: $at" || { echo "nothing new this run"; exit 0; }
          git pull --rebase origin main
          # One retry on push (c76755 on post 5095): on 2026-09-23 runs
          # 35834326441 and 35871037409 verified, countersigned and committed,
          # then lost the line to a GitHub 500 on push. A second failure still
          # fails the run, so a rejection one retry cannot fix stays visible.
          git push || { sleep 15; git pull --rebase origin main && git push; }
          if [ "$witness_failed" -ne 0 ]; then
            exit "$witness_failed"
          fi
        env:
          WITNESS_KEY: ${{ secrets.WITNESS_KEY }}
